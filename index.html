<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gråstensväktarna - Sword Coast</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-title"><h1>GRÅSTENSVÄKTARNA</h1><div class="subtitle">TYRANNY OF DRAGONS</div></div>
    <div class="search-bar"><div class="search-wrap"><input class="search-input" id="searchInput" type="text" placeholder="Sök plats, namn..."><button class="search-btn" id="searchBtn">&#x1F50D;</button></div><div class="suggestions" id="suggestions"></div></div>
    <div class="recap-bar"><button class="recap-btn" id="recapBtn">📜 RECAP</button></div>
    <div class="tab-bar"><button class="tab-btn active" data-tab="adventurers">ÄVENTYRARE</button><button class="tab-btn" data-tab="history">HISTORIK</button><button class="tab-btn" data-tab="npcs">NPC:er</button></div>
    <div class="tab-content"><div class="tab-panel active" id="tab-adventurers"></div><div class="tab-panel" id="tab-history"></div><div class="tab-panel" id="tab-npcs"></div><div class="tab-panel" id="tab-search"></div><div class="tab-panel" id="tab-recap"></div></div>
    <div class="app-version" id="appVersion" title="Appversion – ladda om om du sitter på en gammal version"></div>
  </div>
  <div class="map-container">
    <div class="map-title"><div class="map-subtitle">SWORD COAST</div></div>
    <div class="session-filter"><select id="sessionFilter"></select></div>
    <div class="map-viewport" id="mapViewport"><div class="map-canvas" id="mapCanvas"></div></div>
    <div class="location-popup" id="locationPopup"><div class="popup-header"><h2 id="popupTitle"></h2><button class="popup-close" onclick="closePopup()">X</button></div><div class="popup-summary" id="popupSummary"></div><div class="desc-list" id="popupDescriptions"></div><div class="event-list" id="popupEvents"></div></div>
    <div class="zoom-controls"><button class="zoom-btn" onclick="zoomIn()">+</button><button class="zoom-btn" onclick="zoomOut()">-</button><button class="zoom-btn" onclick="resetView()" style="font-size:9px">R</button></div>
    <div class="legend"><div class="legend-item"><div class="legend-dot visited"></div><span>Besökta platser</span></div><div class="legend-item"><div class="legend-dot known"></div><span>Kända platser</span></div></div>
  </div>
</div>
<div class="interior-view" id="interiorView">
  <div class="interior-canvas">
    <div class="interior-loader" id="interiorLoader"><div class="spinner"></div><div class="interior-loader-text">LADDAR ASKHÅLAN...</div></div>
    <svg class="interior-svg" id="interiorSvg" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="interior-panel">
    <div class="interior-header">
      <h2 id="interiorTitle">ASKHÅLAN</h2>
      <button class="interior-back" onclick="closeInteriorView()">← TILLBAKA</button>
    </div>
    <div class="interior-content" id="interiorContent">
      <div class="interior-empty">Klicka på ett rum för att se information</div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="char-detail-popup" id="charDetailPopup"><div class="char-detail-header"><div class="char-detail-portrait" id="charDetailPortrait"></div><div class="char-detail-info"><h2 id="charDetailName"></h2><div class="detail-class" id="charDetailClass"></div><div class="detail-species" id="charDetailSpecies"></div></div><button class="popup-close" onclick="closePopup()" style="margin-left:auto">X</button></div><div class="char-detail-body" id="charDetailBody"></div></div>
<div class="tl-detail" id="tlDetail"><div class="tl-detail-header"><h2 id="tlDetailTitle"></h2><button class="popup-close" onclick="closePopup()">X</button></div><div class="tl-detail-body" id="tlDetailBody"></div></div>
<div class="faction-detail-popup" id="factionDetailPopup"><div class="faction-detail-header"><div class="faction-symbol" id="factionSymbol"></div><div class="faction-detail-info"><h2 id="factionTitle"></h2><div class="faction-motto" id="factionMotto"></div></div><button class="popup-close" onclick="closePopup()" style="margin-left:auto">X</button></div><div class="faction-detail-body" id="factionBody"></div></div>
<div class="npc-detail-popup" id="npcDetailPopup"><div class="npc-detail-header"><div class="npc-detail-portrait" id="npcDetailPortrait"></div><div class="npc-detail-info"><h2 id="npcDetailTitle"></h2><div class="npc-role-label" id="npcDetailRoleLabel"></div></div><button class="popup-close" onclick="closePopup()" style="margin-left:auto">X</button></div><div class="npc-detail-body" id="npcDetailBody"></div></div>
<script src="app.js" defer></script>
</body>
</html>
